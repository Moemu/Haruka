name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./agent ./server
      - name: build
        run: go build ./...

  cross-compile:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: linux (native)
        run: go build ./...
      - name: windows amd64
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: darwin arm64
        run: GOOS=darwin GOARCH=arm64 go build ./...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: dependency integrity
        run: go mod verify
      - name: package vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -scan=package ./...
