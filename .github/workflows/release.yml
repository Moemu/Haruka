# 发布流（spec §7）：tag 推送触发，构建签名 release APK 并挂到 GitHub Release。
# 签名密钥经 Actions Secrets 注入（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD），不入库；丢密钥意味着只能卸载重装。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ensure Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: decode signing keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: build release apk
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: verify signature and export digests
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep "SHA-256 digest" > cert-digest.txt
          cat cert-digest.txt
          sha256sum "$APK" | tee apk-sha256.txt
      - name: upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "android/app/build/outputs/apk/release/app-release.apk#Haruka-$GITHUB_REF_NAME-android.apk" \
            apk-sha256.txt cert-digest.txt --clobber
