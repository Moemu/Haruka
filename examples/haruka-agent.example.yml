# Haruka 桌面采集端配置。填写登记设备时获得的 id 和 token。
# 窗口标题只在本机解析扩展名后丢弃；进程名经内置映射表转为展示名。

server: http://127.0.0.1:8080 # 本机试用；跨设备部署必须使用 HTTPS
token: <设备令牌>
device_id: <设备ID>         # 服务端登记时生成

# 采样与上报周期。presence 随心跳采样（TTL = max(2×心跳间隔, 10 分钟)）。
heartbeat_interval: 60s
window_interval: 30s
location_interval: 30m
flush_interval: 30s        # 内存队列的批量上报周期
batch_size: 20

collectors:
  presence: true           # 空闲检测（Windows 会话内 GetLastInputInfo）
  activity: true           # 前台应用（本地标题解析，标题原文不出进程）
  location: false          # 本地 xdb 定位时开启；server/off 模式可关闭

location:
  mode: off                # off | server（服务端 xdb）| local（本机 xdb）
  local_db: geo/ip2region.xdb

privacy:
  away_threshold: 5m       # 空闲超过该时长记 away
  file_type: false         # 是否上报正在编辑的文件扩展名

activity:
  private_apps:            # 追加内置私密应用清单，命中即整级匿名化
    - "*Bank*"
  app_map:                 # 追加内置映射表（键为小写进程名）
    webstorm.exe:
      app: WebStorm
      category: coding
      ide: jetbrains

spool:
  max_age: 168h            # 断线缓冲保留 7 天
  max_size: 10MB
