# Haruka 服务端配置示例
listen: 127.0.0.1:8080        # 前置 Caddy 反代 TLS 时监听回环
db: haruka.db                 # 相对启动目录；生产部署请放在私有数据目录

# 仅信任这些代理的 X-Forwarded-For；设备 IP 取 XFF 中从右向左第一个非受信跳。
trusted_proxies: []           # 使用反向代理时，显式填写代理的 IP 或 CIDR

# 公开快照的 CORS 白名单（博客域名）
cors_origins: []              # 跨域读取公开 API 时填写来源；填 "*" 放行任意来源

# 每 IP 令牌桶限流：默认 120 次/分钟、突发 60；rpm 设 0 关闭。
# trusted_proxies 未配置时所有请求视为同一 IP，限流退化为全局。
rate_limit:
  rpm: 120                    # 状态页 30 秒轮询一次，日常用量远低于此
  burst: 60

# 超过新鲜度窗口的观测只入历史，不刷新公开状态
freshness_lag: 10m            # 观测时间距接收时间的最大容差，超出只入库
future_tolerance: 5m          # 允许的小幅时钟超前
clock_skew_warn: 24h          # 偏差超过此值标记 clock_skew

heartbeat_default_interval: 120s  # 设备未登记间隔时的兜底

retention:
  events: 168h                # 原始事件默认 7 天；长保留需显式调大

on_hide: discard              # 隐身期间事件不入库（可选 keep）

aggregation:
  location_source_priority:   # Android 是预留来源，当前只有桌面采集端
    - android
    - desktop

# 方案 A 的离线解析库（ip2region.xdb）路径；留空禁用派生。
location_lookup_db: ""

# ---- 插件（设计案 §7.7）：所有插件一律顶层配置节，单一装载路径 ----
# 三态语义：缺节/enabled:false = 停用；启用但配置无效 = 拒绝启动（绝不静默降级）。
# 新插件两种来源见 docs/plugin-dev.md：编译型（Go 包）与声明型（本例 reading）。

# mood：固定六词通用情绪 + 附言 + 有效期（custom:mood 事件）。无必填配置，缺节默认启用。
# mood:
#   enabled: true

# persona：人格 = 封闭列表（谁在活动），切换长期生效，清除回落默认人格。
# 缺节停用；启用则 list 必填、default（可选）必须 ∈ list。
# persona:
#   enabled: true
#   list:
#     - Muika
#     - 真冬
#   default: Muika

# 声明型插件：数据 = 同名 custom 事件（来源程序自行推送），声明即元数据，
# 状态页自动出卡（快照节 = 最新 payload 平铺 + as_of，TTL 30 分钟）。
# reading:
#   title: 正在读
#   fields:
#     - key: title
#       label: 书名
#     - key: author

# WakaTime：拉取型插件，填个人 OAuth token（wakatime.com/oauth 生成）后
# 每 5 分钟拉取官方 API；缺 token 时启用会拒绝启动。
# token 只保存在本配置文件里，不会出现在公开接口。
# wakatime:
#   enabled: true
#   token: "waka_tok_xxxxxxxx"

# 日志输出 stdout（Docker 推荐，配合 --log-opt 轮转）；
# 填写路径后按 10MB 轮转、保留 1 个旧文件。
log_file: ""
