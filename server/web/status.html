<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Haruka・遥 — 状态页</title>
<link rel="icon" href="/icon.webp" type="image/webp">
<link rel="stylesheet" href="/status.css">
<script src="/status.js" defer></script>
</head>
<body class="mode-loading" data-status-src="/v1/public/status">

<header class="site-head">
  <div class="logo"><img class="logo-mark" src="/icon.webp" alt="" width="40" height="40">Haruka・遥</div>
</header>

<main class="wrap">

  <!-- 常规可见态 -->
  <div id="page-normal">
    <section class="hero">
      <p class="hero-label">当前状态</p>
      <h1 class="hero-state" id="hero-state" data-state="unknown">
        <span class="dot" aria-hidden="true"></span>
        <span id="hero-word">…</span>
      </h1>
      <p class="hero-meta" id="hero-meta">正在连接…</p>
    </section>

    <section class="cards">
      <article class="card" id="card-activity">
        <h2><span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>现在在干嘛</h2>
        <p class="card-body" id="activity-text">…</p>
        <p class="card-asof" id="activity-asof"></p>
      </article>
      <article class="card" id="card-location">
        <h2><span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>现在在哪</h2>
        <p class="card-body" id="location-text">…</p>
        <p class="card-asof" id="location-asof"></p>
      </article>
      <article class="card" id="card-mood">
        <h2><span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 13.5a5 5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/></svg></span>心情</h2>
        <p class="card-body" id="mood-text">…</p>
        <p class="card-asof" id="mood-asof"></p>
      </article>
      <article class="card" id="card-coding" hidden>
        <h2><span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/></svg></span>WakaTime</h2>
        <p class="card-body" id="coding-text">…</p>
        <p class="card-asof" id="coding-asof"></p>
      </article>
      <article class="card card-wide" id="card-devices" hidden>
        <h2><span class="chip" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></span>设备</h2>
        <div class="device-list" id="devices-list"></div>
      </article>
    </section>

    <footer class="site-foot">
      <p class="week" id="week-row" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></p>
      <p id="footer-sync">正在连接…</p>
      <p class="fine">powered by <a href="https://github.com/Moemu/Haruka" target="_blank" rel="noopener">Haruka</a> · 以上均为脱敏后的状态</p>
    </footer>
  </div>

  <!-- 隐身态：整页只剩这一张卡（设计案 6.4 节） -->
  <div id="page-hidden">
    <article class="card solo">
      <h1 class="solo-title">隐身中</h1>
      <p class="card-body">当前不对外展示状态。</p>
      <p class="card-asof" id="hidden-until"></p>
    </article>
  </div>

  <!-- 不可用态：请求失败或数据超过 2 分钟 -->
  <div id="page-error">
    <article class="card solo">
      <h1 class="solo-title" id="error-title">状态暂时不可用</h1>
      <p class="card-body" id="error-body">…</p>
      <p class="card-asof" id="error-meta"></p>
    </article>
  </div>

  <noscript><p class="noscript">要看状态得先启用 JavaScript。</p></noscript>
</main>
</body>
</html>
